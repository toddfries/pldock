# pldock layout
#
# Nested boxes:
#   hbox { ... }   row, leftover width goes to children marked stretch
#   vbox { ... }   column, leftover height goes to stretch
#   tile NAME      swallow this app (wmclock, wmapm, xload, xconsole, or any
#                  command name)
#
# Tile flags / attrs:
#   stretch        grow on the parent box's main axis; fill the cell
#   min=N          floor size in pixels when stretching
#   weight=N       share of leftover (default 1)
#   cmd="a b c"    spawn command (default: the tile name)
#   match=a,b      WM_CLASS / WM_NAME (default: the tile name)
#   size=WxH       native size hint before the window maps
#
# Dock attrs:
#   pos     top-left | top-right | bottom-left | bottom-right
#   screen  primary | eDP-1 | HDMI-1 | left | right | 0
#   width   pixels | fraction (1/3) | percent (33%) of that output
#   height  auto | pixels | fraction of that output
#   gap     pixels between cells
#   override  (default on so -screen sticks under cwm; override=0 or managed)
#   spawn     fork tiles that are not already mapped (off by default)
#
# # comments to end of line.  key=value and `key value` are both fine.

dock {
	pos     bottom-right
	screen  primary
	width   1/6
	height  auto
	gap     2

	vbox {
		hbox {
			tile wmclock
			tile wmapm
			tile xload stretch
		}
		tile xconsole stretch min=96
	}
}
